<button role="tab" aria-selected="{{ day5On }}" style="{{ day5St }}" onClick="{{ day5Pick }}"><span style="font-size: 11px; color: #6E6E7A">Sat</span><span style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Noto Sans Armenian', sans-serif; font-size: 17px; font-weight: 600">7</span></button>

<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4M12 17.5v.01"></path></svg>
<span style="flex: 1; font-size: 15px; line-height: 1.35">Friday has no free time</span>
<button style="height: 36px; padding: 0 12px; border-radius: 12px; border: 0; background: #FFFFFF; color: #6E4300; font-size: 13px; font-weight: 600" onClick="{{ freeTap }}">{{ freeLbl }}</button>
</div>
<section aria-label="Monday" style="display: flex; flex-direction: column; gap: 8px">

<div style="flex: 1; min-height: 64px; box-sizing: border-box; padding: 12px 14px; border-radius: 16px; background: #ECE8FD; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 15px; font-weight: 600">School · 6 lessons</span><span style="font-size: 13px; color: #5B3FD9; font-weight: 600">From timetable</span></div>
<span style="font-size: 13px; color: #6E6E7A">until 13:40</span>
</div>
</div>
<div style="display: flex; gap: 12px; align-items: stretch">
<span style="width: 42px; padding-top: 12px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Noto Sans Armenian', sans-serif; font-size: 13px; font-weight: 600; color: #6E6E7A">14:00</span>
<div style="flex: 1; box-sizing: border-box; padding: 12px 14px; border-radius: 16px; background: #FFFFFF; display: flex; justify-content: space-between"><span style="font-size: 15px; font-weight: 600">Lunch</span><span style="font-size: 13px; color: #6E6E7A">30 min</span></div>
</div>
<div style="display: flex; gap: 12px; align-items: stretch">
<span style="width: 42px; padding-top: 12px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Noto Sans Armenian', sans-serif; font-size: 13px; font-weight: 600; color: #6E6E7A">15:00</span>
<div style="flex: 1; box-sizing: border-box; padding: 12px 14px; border-radius: 16px; background: repeating-linear-gradient(135deg, #ECE8FD 0 10px, #E4F5EC 10px 20px); display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 600">Free time</span><span style="font-size: 13px; font-weight: 600; color: #5B3FD9">Protected</span></div>
</div>
<div style="display: flex; gap: 12px; align-items: stretch">
<span style="width: 42px; padding-top: 12px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Noto Sans Armenian', sans-serif; font-size: 13px; font-weight: 600; color: #6E6E7A">16:30</span>
<div style="flex: 1; box-sizing: border-box; padding: 12px 14px; border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 15px; font-weight: 600">Maths homework</span><span style="font-size: 13px; color: #5B3FD9; font-weight: 600">10 points</span></div>
<span style="font-size: 13px; color: #6E6E7A">Check required</span>
</div>
</div>
<div style="display: flex; gap: 12px; align-items: stretch">
<span style="width: 42px; padding-top: 12px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Noto Sans Armenian', sans-serif; font-size: 13px; font-weight: 600; color: #6E6E7A">17:45</span>
<div style="flex: 1; box-sizing: border-box; padding: 12px 14px; border-radius: 16px; background: #ECE8FD; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 600">Violin</span>

</div>
</div>
<div style="display: flex; gap: 12px; align-items: stretch">
<span style="width: 42px; padding-top: 12px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Noto Sans Armenian', sans-serif; font-size: 13px; font-weight: 600; color: #6E6E7A">19:00</span>
<div style="flex: 1; box-sizing: border-box; padding: 12px 14px; border-radius: 16px; background: #FFFFFF; display: flex; justify-content: space-between"><span style="font-size: 15px; font-weight: 600">Screen time</span><span style="font-size: 13px; color: #6E6E7A">45 min</span></div>
</div>
</section>
<div style="height: 80px; flex-shrink: 0"></div>
</main>
<sc-if value="{{ toastOn }}" hint-placeholder-val="{{ false }}"><div role="status" aria-live="polite" style="position: absolute; left: 16px; right: 16px; bottom: 100px; z-index: 5; padding: 12px 16px; border-radius: 16px; background: #16161D; color: #FFFFFF; font-size: 15px; line-height: 20px; box-shadow: 0 8px 24px rgba(22,22,29,0.10)">{{ toast }}</div></sc-if>
<nav aria-label="Menu" style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 68px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(22,22,29,0.10); display: flex; align-items: center; justify-content: space-around; padding: 0 12px"><a href="Main.dc.html" aria-label="Today" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #6E6E7A"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></a><a href="Plan.dc.html" aria-current="page" aria-label="Plan" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #7C5CFA"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></a><a href="NewTask.dc.html" aria-label="Add a task" style="width: 52px; height: 52px; border-radius: 16px; background: #16161D; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></a><a href="NewTask.dc.html" aria-label="Tasks" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #6E6E7A"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4 6h.01M4 12h.01M4 18h.01"></path></svg></a><a href="Rules.dc.html" aria-label="Rules" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #6E6E7A"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path></svg></a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
_baseVals() {
return {};
}
_toast(msg) {
clearTimeout(this._tt);
this.setState({ toast: msg });
this._tt = setTimeout(() => this.setState({ toast: '' }), 2800);
}
componentWillUnmount() { clearTimeout(this._tt); }
renderVals() {
const s = Object.assign({ day: 0, free: false }, this.state || {});
return Object.assign({}, this._baseVals(), {
day0St: (s.day===0) ? "height: 60px; border: 0; border-radius: 12px; background: #16161D; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px" : "height: 60px; border: 0; border-radius: 12px; background: #FFFFFF; color: #16161D; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px",
day0On: String(s.day===0),
day0Pick: () => { this.setState({day: 0});  },
day1St: (s.day===1) ? "height: 60px; border: 0; border-radius: 12px; background: #16161D; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 600" : "height: 60px; border: 0; border-radius: 12px; background: #FFFFFF; color: #16161D; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px",
day1On: String(s.day===1),
day1Pick: () => { this.setState({day: 1});  },
day2St: (s.day===2) ? "height: 60px; border: 0; border-radius: 12px; background: #16161D; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 600" : "height: 60px; border: 0; border-radius: 12px; background: #FFFFFF; color: #16161D; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px",
day2On: String(s.day===2),
day2Pick: () => { this.setState({day: 2});  },
day3St: (s.day===3) ? "height: 60px; border: 0; border-radius: 12px; background: #16161D; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 600" : "height: 60px; border: 0; border-radius: 12px; background: #FFFFFF; color: #16161D; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px",
day3On: String(s.day===3),
day3Pick: () => { this.setState({day: 3});  },
day4St: (s.day===4) ? "height: 60px; border: 1.5px solid #FFC24B; border-radius: 12px; background: #16161D; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 600" : "height: 60px; border: 1.5px solid #FFC24B; border-radius: 12px; background: #FFFFFF; color: #16161D; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px",
day4On: String(s.day===4),
day4Pick: () => { this.setState({day: 4});  },
day5St: (s.day===5) ? "height: 60px; border: 0; border-radius: 12px; background: #16161D; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 600" : "height: 60px; border: 0; border-radius: 12px; background: #FFFFFF; color: #16161D; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px",
day5On: String(s.day===5),
day5Pick: () => { this.setState({day: 5});  },
day6St: (s.day===6) ? "height: 60px; border: 0; border-radius: 12px; background: #16161D; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 600" : "height: 60px; border: 0; border-radius: 12px; background: #FFFFFF; color: #16161D; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px",
day6On: String(s.day===6),
day6Pick: () => { this.setState({day: 6});  },
freeLbl: s.free ? "Added ✓" : "Add",
freeTap: () => { if (!s.free) { this.setState({free: true}); this._toast("Free time added on Friday, 17:00 to 18:00"); } },
toastOn: !!s.toast, toast: s.toast || ''
});
}
}
</script>

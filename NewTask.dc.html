<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parent · New task</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+Armenian:wght@400;600&display=swap">
<style>
body{margin:0}
a{color:#5B3FD9;text-decoration:none}a:hover{color:#16161D}
button,input{font:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F6FA; color: #16161D; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Noto Sans Armenian', sans-serif; overflow: hidden">
<header style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 24px 12px 8px">
<a href="Plan.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 8px; color: #5B3FD9; font-size: 15px; font-weight: 600; text-decoration: none">Cancel</a>
<h1 style="margin: 0; font-size: 17px; font-weight: 600">New task</h1>
<span style="width: 84px"></span>
</header>
<main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 16px; overflow-y: auto; scrollbar-width: none">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="t-title" style="font-size: 13px; font-weight: 600; color: #6E6E7A">Title</label>
<input id="t-title" value="Russian, ex. 4–6" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid #5B3FD9; background: #FFFFFF; color: #16161D; font-size: 17px; outline: none">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: #6E6E7A">Type</span>
<div role="radiogroup" aria-label="Type" style="display: flex; flex-wrap: wrap; gap: 8px">
<button role="radio" aria-checked="{{ kind0On }}" style="{{ kind0St }}" onClick="{{ kind0Pick }}">Homework</button>
<button role="radio" aria-checked="{{ kind1On }}" style="{{ kind1St }}" onClick="{{ kind1Pick }}">Chore</button>
<button role="radio" aria-checked="{{ kind2On }}" style="{{ kind2St }}" onClick="{{ kind2Pick }}">Routine</button>
<button role="radio" aria-checked="{{ kind3On }}" style="{{ kind3St }}" onClick="{{ kind3Pick }}">Other</button>
</div>
</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 0 14px; display: flex; flex-direction: column">
<button style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0; border: 0; border-bottom: 1px solid #ECECF2; background: transparent; color: #16161D; text-align: left" onClick="{{ subjTap }}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6E7A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a1 1 0 0 1 1-1h11l4 4v11.5a.5.5 0 0 1-.5.5H5a1 1 0 0 1-1-.5z"></path><path d="M8 9h6M8 13h8"></path></svg>
<span style="flex: 1; font-size: 15px">Subject</span><span style="font-size: 15px; color: #6E6E7A">{{ subjVal }}</span>
</button>
<button style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0; border: 0; border-bottom: 1px solid #ECECF2; background: transparent; color: #16161D; text-align: left" onClick="{{ dueTap }}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6E7A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
<span style="flex: 1; font-size: 15px">Due</span><span style="font-size: 15px; color: #6E6E7A">{{ dueVal }}</span>
</button>
<button style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0; border: 0; background: transparent; color: #16161D; text-align: left" onClick="{{ repTap }}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6E7A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"></path><path d="M4 11V9a4 4 0 0 1 4-4h12"></path><path d="M7 22l-3-3 3-3"></path><path d="M20 13v2a4 4 0 0 1-4 4H4"></path></svg>
<span style="flex: 1; font-size: 15px">Repeat</span><span style="font-size: 15px; color: #6E6E7A">{{ repVal }}</span>
</button>
</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 0 14px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 12px; min-height: 64px; border-bottom: 1px solid #ECECF2">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Points</span><span style="font-size: 13px; color: #6E6E7A">Optional</span></div>
<div style="display: flex; align-items: center; gap: 4px">
<button aria-label="Decrease" onClick="{{ dec }}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #ECECF2; background: #FFFFFF; color: #16161D; font-size: 17px">−</button>
<span aria-live="polite" style="width: 44px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Noto Sans Armenian', sans-serif; font-size: 17px; font-weight: 600">{{ points }}</span>
<button aria-label="Add" onClick="{{ inc }}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #ECECF2; background: #FFFFFF; color: #16161D; font-size: 17px">+</button>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 64px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Check required</span><span style="font-size: 13px; color: #6E6E7A">You mark it “Checked” once it’s done</span></div>
<sc-if value="{{ check }}" hint-placeholder-val="{{ true }}"><button role="switch" aria-checked="true" aria-label="Check required" onClick="{{ toggle }}" style="width: 52px; height: 32px; border-radius: 16px; border: 0; padding: 3px; display: flex; justify-content: flex-end; background: #16161D"><span style="width: 26px; height: 26px; border-radius: 12px; background: #FFFFFF"></span></button></sc-if><sc-if value="{{ uncheck }}" hint-placeholder-val="{{ false }}"><button role="switch" aria-checked="false" aria-label="Check required" onClick="{{ toggle }}" style="width: 52px; height: 32px; border-radius: 16px; border: 0; padding: 3px; display: flex; justify-content: flex-start; background: #6E6E7A"><span style="width: 26px; height: 26px; border-radius: 12px; background: #FFFFFF"></span></button></sc-if>
</div>
</div>
<div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #ECE8FD; color: #16161D; font-size: 13px; line-height: 1.45">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
<span>Aram will see this task in his day. Only you create tasks. No AI.</span>
</div>
</main>
<div style="padding: 12px 20px 28px; background: #F6F6FA">
<a href="Plan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #16161D; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">Add to Aram’s plan</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { points: 10, check: true };
}
_baseVals() {
const on = this.state.check;
return {
points: this.state.points,
check: on,
uncheck: !on,
inc: () => this.setState({ points: Math.min(100, this.state.points + 5) }),
dec: () => this.setState({ points: Math.max(0, this.state.points - 5) }),
toggle: () => this.setState({ check: !on })
};
}
_toast(msg) {
clearTimeout(this._tt);
this.setState({ toast: msg });
this._tt = setTimeout(() => this.setState({ toast: '' }), 2800);
}
componentWillUnmount() { clearTimeout(this._tt); }
renderVals() {
const s = Object.assign({ kind: 0, subj: 0, due: 0, rep: 0 }, this.state || {});
return Object.assign({}, this._baseVals(), {
kind0St: (s.kind===0) ? "height: 38px; padding: 0 14px; border-radius: 16px; border: 0; background: #16161D; color: #FFFFFF; font-size: 15px; font-weight: 600" : "height: 38px; padding: 0 14px; border-radius: 16px; border: 1px solid #ECECF2; background: #FFFFFF; color: #16161D; font-size: 15px",
kind0On: String(s.kind===0),
kind0Pick: () => { this.setState({kind: 0});  },
kind1St: (s.kind===1) ? "height: 38px; padding: 0 14px; border-radius: 16px; border: 0; background: #16161D; color: #FFFFFF; font-size: 15px; font-weight: 600" : "height: 38px; padding: 0 14px; border-radius: 16px; border: 1px solid #ECECF2; background: #FFFFFF; color: #16161D; font-size: 15px",
kind1On: String(s.kind===1),
kind1Pick: () => { this.setState({kind: 1});  },
kind2St: (s.kind===2) ? "height: 38px; padding: 0 14px; border-radius: 16px; border: 0; background: #16161D; color: #FFFFFF; font-size: 15px; font-weight: 600" : "height: 38px; padding: 0 14px; border-radius: 16px; border: 1px solid #ECECF2; background: #FFFFFF; color: #16161D; font-size: 15px",
kind2On: String(s.kind===2),
kind2Pick: () => { this.setState({kind: 2});  },
kind3St: (s.kind===3) ? "height: 38px; padding: 0 14px; border-radius: 16px; border: 0; background: #16161D; color: #FFFFFF; font-size: 15px; font-weight: 600" : "height: 38px; padding: 0 14px; border-radius: 16px; border: 1px solid #ECECF2; background: #FFFFFF; color: #16161D; font-size: 15px",
kind3On: String(s.kind===3),
kind3Pick: () => { this.setState({kind: 3});  },
subjVal: ["Russian", "Maths", "English", "Armenian"][s.subj],
subjTap: () => this.setState({subj: (s.subj+1)%4}),
dueVal: ["Tomorrow, 18:00", "Today, 20:00", "Wednesday, 18:00"][s.due],
dueTap: () => this.setState({due: (s.due+1)%3}),
repVal: ["Never", "Every day", "Every week"][s.rep],
repTap: () => this.setState({rep: (s.rep+1)%3})
});
}
}
</script>
</body>
</html>

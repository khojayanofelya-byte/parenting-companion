<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<title>Երեխա · Պարգևներ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+Armenian:wght@400;600&display=swap">
<style>
body{margin:0}
a{color:#5B3FD9;text-decoration:none}a:hover{color:#16161D}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F6FA; color: #16161D; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Noto Sans Armenian', sans-serif; overflow: hidden">
<main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 28px 20px 16px; overflow-y: auto; scrollbar-width: none">
<h1 style="margin: 0; font-size: 28px; font-weight: 600">Պարգևներ</h1>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="background: #ECE8FD; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 600">Միավորներ</span>
<span style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Noto Sans Armenian', sans-serif; font-size: 28px; font-weight: 600; line-height: 1.1">120</span>
</div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 4px">
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 600; color: #6E4300"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1 1.5 2 1.5 3 1-2 1.5-5 1.5-8z"></path></svg>Շարք</span>
<span style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Noto Sans Armenian', sans-serif; font-size: 28px; font-weight: 600; line-height: 1.1">6 <span style="font-family: 'Noto Sans Armenian', sans-serif; font-size: 15px; font-weight: 400; color: #6E6E7A">օր</span></span>
<span style="font-size: 13px; color: #6E6E7A">1 դադար հասանելի է</span>
</div>
</div>
<section aria-label="Գովասանքներ" style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Քեզ գրել են</h2>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px; display: flex; gap: 12px; align-items: flex-start">
<div aria-hidden="true" style="width: 40px; height: 40px; border-radius: 20px; background: #ECE8FD; color: #5B3FD9; display: flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0">Մ</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #6E6E7A">Մայրիկ · երեկ</span>
<span style="font-size: 17px; line-height: 1.4">Ապրես, մաթեմատիկան շուտ ավարտեցիր</span>
</div>
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="#F08A5D" stroke="#F08A5D" stroke-width="1.5" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 20s-7-4.4-9-8.6C1.6 8.4 3.6 5 7 5c2 0 3.3 1.2 5 3 1.7-1.8 3-3 5-3 3.4 0 5.4 3.4 4 6.4C19 15.6 12 20 12 20z"></path></svg>
</div>
</section>
<section aria-label="Պարգևներ" style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Ինչի կարող ես փոխել</h2>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 600">Ընտրել շաբաթավերջի ֆիլմը</span><span style="font-size: 15px; color: #6E6E7A">100 միավոր</span></div>
<button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #16161D; color: #FFFFFF; font-size: 15px; font-weight: 600" onClick="{{ askTap }}">{{ askLbl }}</button>
</div>
</div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 17px; font-weight: 600">Մեկ ժամ ավել խաղ շաբաթ օրը</span><span style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Noto Sans Armenian', sans-serif; font-size: 15px; font-weight: 600; color: #6E6E7A">120/150</span></div>
<div style="height: 10px; border-radius: 5px; background: #ECECF2; overflow: hidden"><div style="width: 80%; height: 10px; border-radius: 5px; background: #7C5CFA"></div></div>
</div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 17px; font-weight: 600">Պիցցա ընտանիքով</span><span style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Noto Sans Armenian', sans-serif; font-size: 15px; font-weight: 600; color: #6E6E7A">120/250</span></div>
<div style="height: 10px; border-radius: 5px; background: #ECECF2; overflow: hidden"><div style="width: 48%; height: 10px; border-radius: 5px; background: #7C5CFA"></div></div>
</div>
</section>
<div style="height: 80px; flex-shrink: 0"></div>
</main>
<sc-if value="{{ toastOn }}" hint-placeholder-val="{{ false }}"><div role="status" aria-live="polite" style="position: absolute; left: 16px; right: 16px; bottom: 100px; z-index: 5; padding: 12px 16px; border-radius: 16px; background: #16161D; color: #FFFFFF; font-size: 15px; line-height: 20px; box-shadow: 0 8px 24px rgba(22,22,29,0.10)">{{ toast }}</div></sc-if>
<nav aria-label="Menu" style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 68px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(22,22,29,0.10); display: flex; align-items: center; justify-content: space-around; padding: 0 12px"><a href="ChildDay-hy.dc.html" aria-label="Իմ օրը" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #6E6E7A"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></a><a href="ChildDay-hy.dc.html" aria-label="Շաբաթ" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #6E6E7A"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></a><a href="AddHomework-hy.dc.html" aria-label="Գրել տնայինը" style="width: 52px; height: 52px; border-radius: 16px; background: #16161D; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></a><a href="Rewards-hy.dc.html" aria-current="page" aria-label="Պարգևներ" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #7C5CFA"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"></rect><path d="M3 12h18M12 8v13M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"></path></svg></a><a href="ParentsSee-hy.dc.html" aria-label="Ծնողներս" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #6E6E7A"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
_baseVals() {
return {};
}
_toast(msg) {
clearTimeout(this._tt);
this.setState({ toast: msg });
this._tt = setTimeout(() => this.setState({ toast: '' }), 2800);
}
componentWillUnmount() { clearTimeout(this._tt); }
renderVals() {
const s = Object.assign({ ask: false }, this.state || {});
return Object.assign({}, this._baseVals(), {
askLbl: s.ask ? "Խնդրված է ✓" : "Խնդրել",
askTap: () => { if (!s.ask) { this.setState({ask: true}); this._toast("Մայրիկն ու հայրիկը ստացան խնդրանքդ։"); } },
toastOn: !!s.toast, toast: s.toast || ''
});
}
}
</script>
</body>
</html>
